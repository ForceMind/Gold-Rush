<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>黄金冲刺</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="Gold Rush.icon.png" />
<link rel="apple-touch-icon" href="Gold Rush.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="Gold Rush.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="Gold Rush.js"></script>
		<script>
// WASM chunk loading configuration
const WASM_CHUNKS = ['Gold Rush.wasm.0', 'Gold Rush.wasm.1'];
const WASM_TOTAL_SIZE = 37700666;
const WASM_EXECUTABLE = 'Gold Rush';

// Pre-load and merge WASM chunks before engine starts
const wasmReady = (async function() {
	const statusProgress = document.getElementById('status-progress');
	const statusOverlay = document.getElementById('status');

	// Show progress bar
	statusOverlay.style.visibility = 'visible';
	statusProgress.style.display = 'block';

	const chunks = [];
	let loadedSize = 0;

	for (let i = 0; i < WASM_CHUNKS.length; i++) {
		const chunkUrl = WASM_CHUNKS[i];
		const response = await fetch(chunkUrl);
		if (!response.ok) {
			throw new Error(`Failed to load WASM chunk: ${chunkUrl}`);
		}
		const chunkData = await response.arrayBuffer();
		chunks.push(new Uint8Array(chunkData));
		loadedSize += chunkData.byteLength;

		// Update progress
		statusProgress.value = loadedSize;
		statusProgress.max = WASM_TOTAL_SIZE;
	}

	// Merge all chunks into one ArrayBuffer
	const merged = new Uint8Array(WASM_TOTAL_SIZE);
	let offset = 0;
	for (const chunk of chunks) {
		merged.set(chunk, offset);
		offset += chunk.length;
	}

	// Hide progress bar after loading
	statusProgress.style.display = 'none';

	return merged.buffer;
})();

// Override fetch to intercept WASM loading
const originalFetch = window.fetch;
window.fetch = function(url, options) {
	// Check if this is a WASM file request
	const urlStr = (typeof url === 'string') ? url : url.url;
	if (urlStr && urlStr.endsWith('.wasm') && urlStr.includes(WASM_EXECUTABLE)) {
		return wasmReady.then(function(buffer) {
			// Create a ReadableStream from the buffer for proper progress tracking
			const stream = new ReadableStream({
				start: function(controller) {
					controller.enqueue(new Uint8Array(buffer));
					controller.close();
				}
			});
			return new Response(stream, {
				headers: [['content-type', 'application/wasm']]
			});
		});
	}
	return originalFetch.call(this, url, options);
};

const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"Gold Rush","experimentalVK":false,"fileSizes":{"Gold Rush.pck":4977132,"Gold Rush.wasm":37700666},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		// Wait for WASM to be ready, then start the game
		wasmReady.then(function() {
			setStatusMode('progress');
			return engine.startGame({
				'onProgress': function (current, total) {
					if (current > 0 && total > 0) {
						statusProgress.value = current;
						statusProgress.max = total;
					} else {
						statusProgress.removeAttribute('value');
						statusProgress.removeAttribute('max');
					}
				},
			});
		}).then(function() {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
